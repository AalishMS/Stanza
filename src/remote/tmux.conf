# Stanza's private tmux server: keep the real CLI's keys and terminal behavior.
set -g status off
set -g prefix None
unbind-key -a
unbind-key -a -T root
set -g mouse on
bind-key -n MouseDown1Pane send-keys -M
bind-key -n MouseUp1Pane send-keys -M
bind-key -n MouseDrag1Pane send-keys -M
bind-key -n MouseDown2Pane send-keys -M
bind-key -n MouseUp2Pane send-keys -M
bind-key -n MouseDown3Pane send-keys -M
bind-key -n MouseUp3Pane send-keys -M
bind-key -n WheelUpPane send-keys -M
bind-key -n WheelDownPane send-keys -M
set -g set-titles on
set -g set-titles-string "#{pane_title}"
set -g focus-events on
set -g default-terminal "tmux-256color"
set -g extended-keys on
set -g allow-passthrough on
set -g remain-on-exit on
set -g exit-empty on
set -s escape-time 0
