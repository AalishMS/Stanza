<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stanza</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <!-- #brand moves to the top bar while the sidebar is collapsed (placeBrand in renderer.js) -->
      <div id="brand">
        <button id="toggle-sidebar" class="btn ghost icon" title="Toggle sidebar (Ctrl+S)"></button>
        <button id="home" title="Home"><span class="logo" id="logo"></span><span class="brand-name">Stanza</span></button>
      </div>
      <div class="search-row">
        <label class="search" title="Search sessions (Ctrl+K)">
          <span id="search-icon"></span>
          <input id="session-search" type="text" placeholder="Search" spellcheck="false" autocomplete="off" />
          <kbd id="search-key"></kbd>
          <button id="search-clear" class="btn ghost icon sm" type="button" title="Clear search" aria-label="Clear search"></button>
        </label>
        <button id="add-project" class="btn ghost icon sm" title="Add a project folder"></button>
        <button id="new-tab" class="btn ghost icon sm" title="New session or chat (Ctrl+T)"></button>
      </div>
      <div id="projects"></div>
      <div id="side-foot"></div>
    </aside>
    <div class="rz" id="rz-left" title="Drag to resize (double-click resets)"></div>
    <div id="peek-zone"></div>

    <div id="workspace">
      <header id="topbar">
        <div class="spacer"></div>
        <button id="close-tab" class="btn ghost icon" title="Close session (Ctrl+W)"></button>
        <button id="split-tab"class="btn ghost icon" title="New session beside this one (Ctrl+Shift+→)"></button>
        <button id="open-code"class="btn ghost icon" title="Open project in VS Code"></button>
        <button id="open-shell" class="btn ghost icon" title="New PowerShell tab in project"></button>
        <button id="open-folder" class="btn ghost icon" title="Show project in Explorer"></button>
        <button id="open-diff" class="btn ghost" hidden></button>
        <button id="toggle-rside" class="btn ghost icon" title="Context, MCPs, subagents and running servers (Ctrl+Shift+S)"></button>
      </header>

      <div id="body">
        <main id="main">
          <div id="terminals">
            <div class="pz" id="pz-v" title="Drag to resize (double-click resets)" hidden></div>
            <div class="pz" id="pz-h" title="Drag to resize (double-click resets)" hidden></div>
          </div>
          <div id="dropzone"><div id="drop-preview" hidden></div></div>
          <div id="welcome"></div>
          <div id="settings" tabindex="-1" aria-label="Settings"></div>
        </main>
        <div class="rz" id="rz-right" title="Drag to resize (double-click resets)"></div>
        <aside id="rside">
          <div id="rside-panel"></div>
          <div id="rside-doc" hidden></div>
          <div id="rside-diff" hidden></div>
          <nav id="rside-pill" aria-label="Sidebar tabs" hidden></nav>
        </aside>
        <div id="rpeek-zone"></div>
      </div>

      <footer id="statusbar">
        <div id="status-left"></div>
        <div class="spacer"></div>
        <div id="status-info"></div>
        <div id="status-right"></div>
      </footer>
    </div>
  </div>

  <div id="modal" hidden></div>
  <div id="detail" hidden></div>
  <div id="update-pop" role="dialog" aria-label="Update available" hidden></div>
  <div id="menu" role="menu" hidden></div>

  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
  <script src="../node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
  <script src="lib/ui.js"></script>
  <script src="lib/md.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
